<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="memeTitle memeDesc">
  <title id="memeTitle">Expectation vs. Reality: Embedded SW Architecture</title>
  <desc id="memeDesc">Left panel "Expectation": a clean rocket labeled Clean Architecture flying toward a star labeled Ship It. Right panel "Reality": a tangled wire ball labeled It Works On My Debugger, next to a bug icon and the caption GC ate the flashing sequence again.</desc>

  <rect width="640" height="340" fill="#161616"/>

  <rect x="16" y="16" width="288" height="308" rx="14" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="2"/>
  <rect x="336" y="16" width="288" height="308" rx="14" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="2"/>

  <text x="160" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8b64c">EXPECTATION</text>
  <text x="480" y="50" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8734c">REALITY</text>

  <g transform="translate(160,150) rotate(-35)">
    <rect x="-14" y="-55" width="28" height="70" rx="14" fill="#d6d6d6"/>
    <polygon points="-14,-55 14,-55 0,-85" fill="#e8b64c"/>
    <polygon points="-14,15 0,40 -22,32" fill="#8a8a8a"/>
    <polygon points="14,15 0,40 22,32" fill="#8a8a8a"/>
    <circle cx="0" cy="-25" r="7" fill="#3a3a3a"/>
  </g>
  <text x="160" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#cfcfcf">Clean Architecture,</text>
  <text x="160" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#cfcfcf">one clean commit,</text>
  <text x="160" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#cfcfcf">ship it Friday afternoon.</text>

  <g transform="translate(480,175)">
    <path d="M -40 -10 C -20 -40, 20 -40, 35 -15 C 55 -25, 50 10, 30 15 C 40 35, 5 45, -10 25 C -35 40, -55 10, -35 -5 C -55 -5, -55 -25, -40 -10 Z"
          fill="none" stroke="#8ab6d6" stroke-width="4" stroke-linecap="round"/>
    <path d="M -25 -5 C 0 5, 15 -10, 25 5 C 10 15, -5 5, -25 -5 Z"
          fill="none" stroke="#8ab6d6" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(505,140)">
    <ellipse cx="0" cy="0" rx="9" ry="7" fill="#e8734c"/>
    <line x1="-9" y1="-4" x2="-16" y2="-10" stroke="#e8734c" stroke-width="2"/>
    <line x1="9" y1="-4" x2="16" y2="-10" stroke="#e8734c" stroke-width="2"/>
    <line x1="-9" y1="4" x2="-16" y2="10" stroke="#e8734c" stroke-width="2"/>
    <line x1="9" y1="4" x2="16" y2="10" stroke="#e8734c" stroke-width="2"/>
  </g>
  <text x="480" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#cfcfcf">"It works on my debugger,"</text>
  <text x="480" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#cfcfcf">and GC decided the flashing</text>
  <text x="480" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#cfcfcf">sequence needed company.</text>

  <text x="320" y="315" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#7a7a7a">a fair and balanced summary of every project, ever</text>
</svg>
