<text x="294.4" y="62" fill="#9a6700" font-weight="600">FLT marker: interrupt lock of 10 ms (budget: 500 us)</text>
<text x="514.8" y="93" text-anchor="middle" fill="#cf222e">no SysTick for 10 ms</text>
<text x="514.8" y="223" text-anchor="middle" fill="#ffffff" font-weight="600">Task100ms: one 10.2 ms slice</text>
<rect x="120" y="320" width="12" height="12" fill="#8250df" rx="2"/><text x="138" y="330" fill="#1f2328">ISR (category 2)</text>
<rect x="260" y="320" width="12" height="12" fill="#59636e" rx="2"/><text x="278" y="330" fill="#1f2328">system thread</text>
<rect x="390" y="320" width="12" height="12" fill="#0969da" rx="2"/><text x="408" y="330" fill="#1f2328">application thread</text>
<rect x="550" y="320" width="12" height="12" fill="#cf222e" rx="2"/><text x="568" y="330" fill="#1f2328">the culprit</text>
