<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">
<title>Task and ISR timeline from a QEMU run: a 10 ms interrupt lock</title>
<desc>Timeline of ISRs and threads from a QEMU run. A task holds an interrupt lock for 10 ms; during that time the SysTick interrupt does not run and one thread occupies the CPU in a single slice.</desc>
<rect width="900" height="350" fill="#ffffff"/>
<text x="120" y="22" font-size="14" font-weight="600" fill="#1f2328">Lock fault: one task blocks interrupts for 10 ms, SysTick cannot run</text>
<text x="120" y="40" fill="#59636e">QEMU run, virtual time in ms, 1996 to 2013 (grid every 2 ms)</text>
<rect x="0" y="76" width="900" height="26" fill="#f6f8fa"/>
<text x="112" y="93" text-anchor="end" fill="#1f2328">SysTick</text>
<text x="112" y="119" text-anchor="end" fill="#1f2328">HwCounter</text>
<rect x="0" y="128" width="900" height="26" fill="#f6f8fa"/>
<text x="112" y="145" text-anchor="end" fill="#1f2328">Timer thread</text>
<text x="112" y="171" text-anchor="end" fill="#1f2328">TpWatchdog</text>
<rect x="0" y="180" width="900" height="26" fill="#f6f8fa"/>
<text x="112" y="197" text-anchor="end" fill="#1f2328">Task10ms</text>
<text x="112" y="223" text-anchor="end" fill="#1f2328">Task100ms</text>
<rect x="0" y="232" width="900" height="26" fill="#f6f8fa"/>
<text x="112" y="249" text-anchor="end" fill="#1f2328">BswTask</text>
<text x="112" y="275" text-anchor="end" fill="#1f2328">CalibServer</text>
<line x1="120.0" y1="76" x2="120.0" y2="284" stroke="#d0d7de" stroke-width="1"/>
<text x="120.0" y="300" text-anchor="middle" fill="#59636e">1996</text>
<line x1="209.4" y1="76" x2="209.4" y2="284" stroke="#d0d7de" stroke-width="1"/>
<text x="209.4" y="300" text-anchor="middle" fill="#59636e">1998</text>
<line x1="298.8" y1="76" x2="298.8" y2="284" stroke="#d0d7de" stroke-width="1"/>
<text x="298.8" y="300" text-anchor="middle" fill="#59636e">2000</text>
<line x1="388.2" y1="76" x2="388.2" y2="284" stroke="#d0d7de" stroke-width="1"/>
<text x="388.2" y="300" text-anchor="middle" fill="#59636e">2002</text>
<line x1="477.6" y1="76" x2="477.6" y2="284" stroke="#d0d7de" stroke-width="1"/>
<text x="477.6" y="300" text-anchor="middle" fill="#59636e">2004</text>
<line x1="567.1" y1="76" x2="567.1" y2="284" stroke="#d0d7de" stroke-width="1"/>
<text x="567.1" y="300" text-anchor="middle" fill="#59636e">2006</text>
<line x1="656.5" y1="76" x2="656.5" y2="284" stroke="#d0d7de" stroke-width="1"/>
<text x="656.5" y="300" text-anchor="middle" fill="#59636e">2008</text>
<line x1="745.9" y1="76" x2="745.9" y2="284" stroke="#d0d7de" stroke-width="1"/>
<text x="745.9" y="300" text-anchor="middle" fill="#59636e">2010</text>
<line x1="835.3" y1="76" x2="835.3" y2="284" stroke="#d0d7de" stroke-width="1"/>
<text x="835.3" y="300" text-anchor="middle" fill="#59636e">2012</text>
