<title id="sec-surface-title">Attack surface of the BCU</title>
<desc id="sec-surface-desc">Six ways into the BCU from outside. The OBD port and the four CAN FD channels, and Ethernet with DoIP, both end at Core 1, which runs the gateway, SecOC and a rule-based IDS. The eight LIN channels, some running to doors and mirrors, end at Core 2. The key transponder ends at Core 5, which runs diagnostics, the immobilizer and the update manager. Update packages end at Stage-2. The debug port is controlled by the HSM and the lifecycle state. Core 1 passes ASIL-relevant signals to the ASIL B Core 0 through the mailbox with E2E protection. The hardwired brake switch reaches Core 0 directly, without any bus. The HSM holds all keys behind a firewall.</desc>

<figcaption>
Every way into the BCU, and where it lands. The badges are the doors of this series: 1–2 in Part 1, 3–5 in Part 2, 6–10 in Part 3.
<ul>
<li>All external input lands on a QM core or on the bootloader, never directly on the ASIL B core. ASIL-relevant data reaches Core 0 only through the mailbox, and Core 0 checks it with E2E.</li>
<li>The brake light has a second path that no bus can reach: the hardwired brake switch.</li>
<li>Every key is in the HSM. The cores send jobs to it (dashed lines) and only get results back.</li>
</ul>
</figcaption>
