title: Embedded Architecture Notes
description: >-
  Notes on software architecture for embedded systems — security, flashing,
  communication, RTOS, AUTOSAR, firmware, debugging, AI, and engineering
  processes — drawn from professional work and self-study.
author: Robert
email: robert.koerner87@googlemail.com
baseurl: "" # subpath if this is a project site, e.g. "/blog" — leave empty for a <user>.github.io root site
# Canonical domain. A Cloudflare Worker on this domain proxies GitHub Pages and
# gates /premium/* (see the private repo). Also used for the unlock form action.
url: "https://kuebelrobert-dev.space"

# GoatCounter (privacy-friendly, cookieless analytics) site code — the part
# before ".goatcounter.com" in your dashboard URL. Sign up free at
# https://www.goatcounter.com/signup, then fill this in. Leave empty to
# disable both the sitewide tracking script and the per-post view badge.
# For the per-post badge to show numbers, also enable "Allow adding visitor
# counts on your website" in your GoatCounter site settings.
goatcounter_code: "kuebelrobert"

theme: minima

# Native GitHub Pages plugin whitelist — these are safe to use without a
# custom GitHub Actions build.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

minima:
  skin: dark
  nav_pages:
    - about.md
    - books.md
    - categories.md
    - impressum.md
    - privacy.md

permalink: /:categories/:year/:month/:day/:title/

markdown: kramdown
kramdown:
  syntax_highlighter: rouge

# Exclude non-site files from the generated output
exclude:
  - Gemfile
  - Gemfile.lock
  - PLAN.md
  - README.md
  - vendor
